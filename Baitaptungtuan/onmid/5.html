<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Three paragraphs</title>
</head>
<body>
  <p style="text-align:left; background:#f8d7da; padding:10px; margin:10px 0;">
    Đây là đoạn canh trái.
  </p>

  <p style="text-align:center; background:#d1ecf1; padding:10px; margin:10px 0;">
    Đây là đoạn canh giữa.
  </p>

  <p style="text-align:right; background:#d4edda; padding:10px; margin:10px 0;">
    Đây là đoạn canh phải.
  </p>
</body>
</html>
